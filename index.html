<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>명함첩 · BNI Cardbook</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore-compat.js"></script>
<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.0/kakao.min.js" integrity="sha384-kQ7G1PEJHffmD/K0M9WqZlgLqKp0MvJtvtBkxS3Qa1ozkDwGTtsM7HkYgwyH/ghl" crossorigin="anonymous"></script>
<style>
:root{
  --dark:#f0faf4;--dark2:#e4f4ea;--dark3:#d4ecdc;
  --gold:#a07820;--gold-dim:rgba(160,120,32,0.13);
  --cream:#1a3a2a;
  --red:#C8102E;--red-dim:rgba(200,16,46,0.10);
  --muted:rgba(30,70,48,0.6);
  --border:rgba(30,100,60,0.15);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--dark);color:var(--cream);font-family:'Noto Sans KR',sans-serif;max-width:430px;margin:0 auto;min-height:100vh;}

/* TOP BAR */
.top-bar{position:sticky;top:0;z-index:100;background:rgba(240,250,244,0.97);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:12px 16px;}
.top-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.top-title{font-family:'Nanum Gothic',sans-serif;font-size:17px;font-weight:800;color:#1a3a2a;display:flex;align-items:center;gap:8px;}
.top-title span{color:var(--gold);}
.user-row{display:flex;align-items:center;gap:8px;}
.user-name{font-size:11px;color:var(--muted);}
.logout-btn{font-size:11px;color:var(--muted);background:none;border:1px solid rgba(30,100,60,0.2);border-radius:6px;padding:3px 9px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all .2s;}
.logout-btn:hover{color:#1a3a2a;border-color:rgba(30,100,60,0.5);}

/* SEARCH */
.search-wrap{position:relative;}
.search-input{width:100%;background:rgba(255,255,255,0.7);border:1px solid var(--border);border-radius:12px;padding:10px 40px 10px 14px;font-size:13px;color:var(--cream);font-family:'Noto Sans KR',sans-serif;outline:none;transition:all .3s;}
.search-input::placeholder{color:var(--muted);}
.search-input:focus{border-color:var(--gold);background:rgba(255,255,255,0.9);}
.search-icon{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:16px;pointer-events:none;}
.ai-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(201,168,76,0.08);border:1px solid rgba(201,168,76,0.2);border-radius:8px;padding:3px 8px;font-size:10px;color:var(--gold);margin-top:6px;letter-spacing:.05em;}

/* CHAPTER TABS */
.chapter-tabs{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;scrollbar-width:none;}
.chapter-tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:6px 14px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:rgba(255,255,255,0.5);color:var(--muted);font-family:'Noto Sans KR',sans-serif;transition:all .25s;}
.tab.active{background:var(--gold);color:#1a1209;border-color:var(--gold);}
.tab:hover:not(.active){color:var(--gold);border-color:var(--gold);}

/* COUNT */
.count-bar{padding:8px 16px 4px;display:flex;align-items:center;justify-content:space-between;}
.count-label{font-size:10px;color:var(--muted);letter-spacing:.1em;}
.count-num{font-family:'Playfair Display',serif;font-size:13px;color:var(--gold);}

/* CARD LIST */
.card-list{padding:4px 12px 100px;display:flex;flex-direction:column;gap:10px;}

/* BIZ CARD */
.biz-card{background:#c8e6d0;border:1px solid rgba(30,100,60,0.25);border-radius:16px;overflow:hidden;transition:all .3s;}
.biz-card:hover{background:#b8dcc4;border-color:rgba(160,120,32,0.4);}
.card-main{padding:16px 16px 10px;display:flex;gap:12px;align-items:flex-start;}
.card-avatar{width:48px;height:48px;border-radius:12px;flex-shrink:0;background:rgba(160,120,32,0.12);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:20px;color:var(--gold);overflow:hidden;}
.card-avatar img{width:100%;height:100%;object-fit:cover;}
.card-info{flex:1;min-width:0;}
.card-name{font-family:'Nanum Gothic',sans-serif;font-size:16px;font-weight:800;color:#0d2218;margin-bottom:2px;}
.card-name-en{font-family:'Playfair Display',serif;font-size:11px;color:var(--gold);font-style:italic;margin-bottom:4px;}
.card-company{font-size:12px;color:rgba(240,232,216,0.65);margin-bottom:2px;}
.card-chapter{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:#1a3a2a;background:rgba(255,255,255,0.4);border-radius:6px;padding:2px 7px;}
.bni-badge{display:inline-flex;align-items:center;gap:4px;background:var(--red-dim);border:1px solid rgba(200,16,46,0.2);border-radius:8px;padding:2px 8px;font-size:10px;color:rgba(240,100,100,0.85);margin-top:5px;}
.bni-dot{width:4px;height:4px;background:var(--red);border-radius:50%;flex-shrink:0;}

/* ACTIONS */
.card-actions{padding:0 12px 12px;display:flex;gap:7px;}
.act-btn{flex:1;padding:9px 6px;border-radius:10px;font-size:11px;font-weight:600;cursor:pointer;font-family:'Noto Sans KR',sans-serif;display:flex;align-items:center;justify-content:center;gap:4px;text-decoration:none;border:none;min-height:36px;transition:all .2s;}
.act-call{background:var(--gold-dim);border:1px solid rgba(201,168,76,0.3);color:var(--gold);}
.act-view{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:rgba(240,232,216,0.7);}
.act-del{background:var(--red-dim);border:1px solid rgba(200,16,46,0.2);color:rgba(200,16,46,0.7);flex:0 0 36px;padding:9px;}
.act-btn:hover{opacity:.75;transform:scale(0.97);}

/* CRM */
.card-crm{border-top:1px solid var(--border);padding:10px 14px;display:none;}
.card-crm.open{display:block;}
.crm-title{font-size:10px;color:var(--gold);letter-spacing:.1em;margin-bottom:8px;}
.crm-row{display:flex;gap:8px;margin-bottom:8px;}
.crm-input{flex:1;background:rgba(255,255,255,0.8);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:12px;color:var(--cream);font-family:'Noto Sans KR',sans-serif;outline:none;}
.crm-input:focus{border-color:var(--gold);}
.crm-save{background:var(--gold);color:#1a1209;border:none;border-radius:8px;padding:7px 12px;font-size:11px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;white-space:nowrap;}
.crm-log{margin-top:6px;}
.crm-item{font-size:11px;color:var(--muted);padding:5px 0;border-bottom:1px solid rgba(30,100,60,0.08);display:flex;justify-content:space-between;align-items:center;}
.crm-item:last-child{border-bottom:none;}
.crm-item-text{flex:1;}
.crm-item-del{background:none;border:none;color:rgba(200,16,46,0.4);cursor:pointer;font-size:12px;padding:0 4px;}
.crm-toggle{width:100%;background:rgba(255,255,255,0.2);border:none;color:#1a3a2a;font-size:10px;letter-spacing:.07em;cursor:pointer;padding:6px 14px;font-family:'Noto Sans KR',sans-serif;display:flex;align-items:center;gap:5px;border-top:1px solid rgba(30,100,60,0.08);transition:color .2s;}
.crm-toggle:hover{color:var(--gold);}
.card-saved{padding:0 14px 10px;font-size:10px;color:rgba(240,232,216,0.18);}

/* LOGIN */
.login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;padding:40px 24px;text-align:center;}
.login-icon{font-size:56px;margin-bottom:20px;}
.login-title{font-family:'Nanum Gothic',sans-serif;font-size:22px;font-weight:800;color:#1a3a2a;margin-bottom:10px;}
.login-desc{font-size:13px;color:var(--muted);line-height:1.8;margin-bottom:24px;}
.auth-tabs{display:flex;gap:0;margin-bottom:20px;border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.auth-tab{flex:1;background:none;border:none;padding:10px 16px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .2s;font-family:'Noto Sans KR',sans-serif;}
.auth-tab.active{background:var(--gold);color:#1a1209;}
.auth-form{width:100%;max-width:300px;display:flex;flex-direction:column;gap:10px;margin-bottom:20px;}
.auth-input{background:rgba(255,255,255,0.08);border:1px solid var(--border);border-radius:12px;padding:12px 14px;color:var(--cream);font-size:14px;font-family:'Noto Sans KR',sans-serif;outline:none;width:100%;}
.auth-input:focus{border-color:var(--gold);}
.auth-submit{background:var(--gold);color:#1a1209;border:none;border-radius:30px;padding:13px;font-weight:800;font-size:14px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;width:100%;}
.error-msg{color:#ff9e8f;font-size:11px;min-height:16px;}
.social-divider{display:flex;align-items:center;gap:12px;margin:16px 0;color:var(--muted);font-size:11px;width:100%;max-width:300px;}
.social-divider div{flex:1;height:1px;background:var(--border);}
.social-buttons{display:flex;gap:10px;width:100%;max-width:300px;}
.google-btn,.kakao-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:40px;padding:11px 16px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;font-family:'Noto Sans KR',sans-serif;}
.google-btn{background:#fff;color:#1a1a1a;box-shadow:0 2px 8px rgba(0,0,0,0.2);}
.kakao-btn{background:#FEE500;color:#3c1e1e;}
.google-btn:hover,.kakao-btn:hover{transform:translateY(-2px);}

/* MISC */
.loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:14px;}
.spinner{width:32px;height:32px;border:3px solid rgba(201,168,76,0.15);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:12px;color:var(--muted);}
.empty-state{display:flex;flex-direction:column;align-items:center;padding:60px 28px;text-align:center;}
.empty-icon{font-size:48px;margin-bottom:16px;opacity:.5;}
.empty-title{font-size:15px;font-weight:700;color:#fff;margin-bottom:6px;}
.empty-desc{font-size:12px;color:var(--muted);line-height:1.75;}
.ai-result{margin:0 12px 8px;padding:10px 14px;background:rgba(201,168,76,0.06);border:1px solid rgba(201,168,76,0.2);border-radius:10px;font-size:12px;color:rgba(240,232,216,0.7);line-height:1.6;}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:430px;background:rgba(10,10,10,0.97);backdrop-filter:blur(16px);border-top:1px solid var(--border);z-index:200;display:flex;}
.nav-btn{flex:1;padding:13px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--muted);text-decoration:none;background:none;border:none;cursor:pointer;transition:all .3s;font-family:'Noto Sans KR',sans-serif;}
.nav-btn .icon{font-size:20px;line-height:1;}
.nav-btn:hover,.nav-btn.active{color:var(--gold);}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:rgba(20,18,9,0.97);border:1px solid var(--border);border-radius:10px;padding:10px 18px;font-size:12px;color:var(--cream);z-index:500;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}
.ai-loading{display:flex;align-items:center;gap:8px;padding:10px 16px;font-size:12px;color:var(--gold);}
.ai-dot{width:5px;height:5px;border-radius:50%;background:var(--gold);animation:bounce .8s infinite;}
.ai-dot:nth-child(2){animation-delay:.15s;}
.ai-dot:nth-child(3){animation-delay:.3s;}
@keyframes bounce{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
</style>
</head>
<body>
<div id="appRoot">
  <div class="loading-screen"><div class="spinner"></div><div class="loading-text">불러오는 중...</div></div>
</div>
<div class="toast" id="toast"></div>

<script>
// ===== Firebase 초기화 =====
const firebaseConfig = {
  apiKey: "AIzaSyAZoWSGSA81daZydNgzegct2aaeFbDajr0",
  authDomain: "mandu-e7c3c.firebaseapp.com",
  projectId: "mandu-e7c3c",
  storageBucket: "mandu-e7c3c.firebasestorage.app",
  messagingSenderId: "196338490174",
  appId: "1:196338490174:web:78dc77e684945aca362a6f"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// ===== 카카오 초기화 =====
if(typeof Kakao !== 'undefined' && !Kakao.isInitialized()) {
  Kakao.init('7a736ceca6b6865251e078261ed9596f');
}

let currentUser = null;
let allCards = [];
let currentChapter = '전체';
let searchTimer = null;
let authMode = 'login';
const CHAPTERS = ['전체','파이오니어','자이언츠','기타'];

// ===== 유틸 =====
function showToast(msg, ms=2500) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), ms);
}
function fmtDate(iso) {
  if(!iso) return '';
  try { return new Date(iso).toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'}); }
  catch{ return iso; }
}
function initial(n) { return n ? n.charAt(0) : '?'; }

// ===== 로그인 화면 =====
function renderLogin() {
  document.getElementById('appRoot').innerHTML = `
    <div class="login-screen">
      <div class="login-icon">🗂️</div>
      <div class="login-title">BNI 명함첩</div>
      <div class="login-desc">전문가 명함을 스마트하게 관리하세요</div>
      <div class="auth-tabs">
        <button class="auth-tab ${authMode==='login'?'active':''}" onclick="setAuthMode('login')">로그인</button>
        <button class="auth-tab ${authMode==='signup'?'active':''}" onclick="setAuthMode('signup')">회원가입</button>
      </div>
      <div class="auth-form">
        <input type="email" id="authEmail" class="auth-input" placeholder="이메일" autocomplete="email">
        <input type="password" id="authPassword" class="auth-input" placeholder="비밀번호 (6자 이상)" autocomplete="current-password">
        <button class="auth-submit" onclick="handleEmailAuth()">${authMode==='login'?'로그인':'회원가입'}</button>
        <div id="authError" class="error-msg"></div>
      </div>
      <div class="social-divider"><div></div><span>또는</span><div></div></div>
      <div class="social-buttons">
        <button class="google-btn" onclick="doGoogleLogin()">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Google
        </button>
        <button class="kakao-btn" onclick="doKakaoLogin()">
          <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#3c1e1e" d="M9 1.5C4.86 1.5 1.5 4.14 1.5 7.38c0 2.07 1.35 3.87 3.39 4.92l-.87 3.21 3.72-2.46c.42.06.84.09 1.26.09 4.14 0 7.5-2.64 7.5-5.88S13.14 1.5 9 1.5z"/></svg>
          카카오
        </button>
      </div>
    </div>
    <div class="bottom-nav">
      <a href="https://jinjjabg-hub.github.io/BNI-PIONEER-cards/송승훈/" class="nav-btn"><span class="icon">📇</span><span>내 명함</span></a>
      <button class="nav-btn active"><span class="icon">🗂️</span><span>명함첩</span></button>
      <button class="nav-btn" onclick="shareApp()"><span class="icon">📤</span><span>공유</span></button>
    </div>
  `;
  // 엔터키 지원
  setTimeout(() => {
    const pw = document.getElementById('authPassword');
    if(pw) pw.addEventListener('keypress', e => { if(e.key==='Enter') handleEmailAuth(); });
  }, 100);
}

window.setAuthMode = function(mode) { authMode = mode; renderLogin(); };

// ===== 이메일 로그인/회원가입 =====
window.handleEmailAuth = async function() {
  const email = document.getElementById('authEmail')?.value.trim();
  const pw = document.getElementById('authPassword')?.value.trim();
  const errEl = document.getElementById('authError');
  if(!email || !pw) { errEl.innerText='이메일과 비밀번호를 입력해주세요.'; return; }
  errEl.innerText = '';
  try {
    if(authMode === 'login') {
      await auth.signInWithEmailAndPassword(email, pw);
    } else {
      const cred = await auth.createUserWithEmailAndPassword(email, pw);
      showToast('✅ 회원가입 완료!');
    }
  } catch(e) {
    const msgs = {
      'auth/email-already-in-use': '이미 가입된 이메일입니다.',
      'auth/wrong-password': '비밀번호가 틀렸습니다.',
      'auth/user-not-found': '등록되지 않은 이메일입니다.',
      'auth/weak-password': '비밀번호는 6자 이상이어야 합니다.',
      'auth/invalid-email': '이메일 형식이 올바르지 않습니다.',
    };
    errEl.innerText = msgs[e.code] || e.message;
  }
};

// ===== Google 로그인 =====
window.doGoogleLogin = async function() {
  try { await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
  catch(e) { if(e.code !== 'auth/popup-closed-by-user') showToast('Google 로그인 실패'); }
};

// ===== 카카오 로그인 (안정화 버전) =====
// 핵심: kakaoId 기반 고정 비밀번호 사용 (getTime 제거)
window.doKakaoLogin = async function() {
  if(typeof Kakao === 'undefined' || !Kakao.isInitialized()) {
    showToast('카카오 SDK 초기화 중... 잠시 후 다시 시도해주세요.'); return;
  }
  try {
    // 1. 카카오 로그인
    await new Promise((resolve, reject) => {
      Kakao.Auth.login({ success: resolve, fail: reject });
    });
    // 2. 사용자 정보
    const profile = await new Promise((resolve, reject) => {
      Kakao.API.request({ url: '/v2/user/me', success: resolve, fail: reject });
    });
    const kakaoId = String(profile.id);
    const email = profile.kakao_account?.email || `kakao_${kakaoId}@cardbook.bni`;
    const name = profile.properties?.nickname || '카카오사용자';
    const photo = profile.properties?.profile_image || null;

    // 3. 고정 비밀번호 (kakaoId 기반 — 매번 동일)
    const fixedPw = `kb_${kakaoId}_fixed`;

    try {
      await auth.signInWithEmailAndPassword(email, fixedPw);
      showToast('✅ 카카오 로그인 성공');
    } catch(e) {
      if(e.code === 'auth/user-not-found' || e.code === 'auth/invalid-credential') {
        // 신규 사용자 — 계정 생성
        await auth.createUserWithEmailAndPassword(email, fixedPw);
        await auth.currentUser.updateProfile({ displayName: name, photoURL: photo });
        showToast('✅ 카카오로 가입 완료!');
      } else if(e.code === 'auth/wrong-password') {
        // 같은 이메일로 다른 방식으로 가입된 경우
        showToast('이미 다른 방식으로 가입된 이메일입니다.');
      } else throw e;
    }
  } catch(e) {
    if(e.error === 'access_denied') showToast('카카오 로그인 취소');
    else { console.error(e); showToast('카카오 로그인 실패: ' + (e.message || '오류')); }
  }
};

// ===== 로그아웃 =====

  if(typeof Kakao !== 'undefined' && Kakao.isInitialized() && Kakao.Auth.getAccessToken()) {

};

      </div>

// ===== 카드 렌더링 =====
function renderCards(cards) {
  const countEl = document.getElementById('countNum');
  const list = document.getElementById('cardList');
  if(!list) return;
  if(countEl) countEl.textContent = cards.length;

  if(cards.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">🗂️</div><div class="empty-title">${currentChapter==='전체'?'저장된 명함이 없어요':currentChapter+' 챕터 명함이 없어요'}</div><div class="empty-desc">명함 페이지에서<br>"명함 저장하기" 버튼을 눌러 추가하세요.</div></div>`;
    return;
  }

  list.innerHTML = cards.map((card, i) => {
    const avatarHtml = card.avatar
      ? `<img src="${card.avatar}" alt="${card.name}" onerror="this.style.display='none'">`
      : initial(card.name);
    const bniHtml = card.bni ? `<div class="bni-badge"><div class="bni-dot"></div>${card.bni}</div>` : '';
    const meetings = card.meetings || [];
    const referrals = card.referrals || [];
    const lastContact = card.lastContact || '';
    const meetingLogs = meetings.map((m,mi) => `
      <div class="crm-item">
        <span class="crm-item-text">📅 121 · ${m.date}${m.memo?' · '+m.memo:''}</span>
        <button class="crm-item-del" onclick="deleteCRM('${card.docId}','meetings',${mi})">✕</button>
      </div>`).join('');
    const referralLogs = referrals.map((r,ri) => `
      <div class="crm-item">
        <span class="crm-item-text">🤝 리퍼럴 · ${r.date}${r.memo?' · '+r.memo:''}</span>
        <button class="crm-item-del" onclick="deleteCRM('${card.docId}','referrals',${ri})">✕</button>
      </div>`).join('');
    const lastContactStr = lastContact ? `<div class="crm-item"><span class="crm-item-text">⏱️ 마지막 연락 · ${fmtDate(lastContact)}</span></div>` : '';
    const crmCount = meetings.length + referrals.length;

    return `
    <div class="biz-card">
      <div class="card-main">
        <div class="card-avatar">${avatarHtml}</div>
        <div class="card-info">
          <div class="card-name">${card.name||'이름 없음'}</div>
          ${card.nameEn?`<div class="card-name-en">${card.nameEn}</div>`:''}
          ${card.company?`<div class="card-company">${card.company}</div>`:''}
          ${card.chapter?`<div class="card-chapter">📍 ${card.chapter}</div>`:''}
          ${bniHtml}
        </div>
      </div>
      <div class="card-actions">
        ${card.phone?`<a href="tel:${card.phone}" class="act-btn act-call" onclick="updateLastContact('${card.docId}')">📞 ${card.phone}</a>`:'<span></span>'}
        ${card.url?`<a href="${card.url}" target="_blank" class="act-btn act-view">🔗 명함 보기</a>`:''}
        <button class="act-btn act-del" onclick="deleteCard('${card.docId}','${card.name.replace(/'/g,"\\'")}')">🗑️</button>
      </div>
      <button class="crm-toggle" onclick="toggleCRM(this)">
        <span class="crm-arrow">▶</span> BNI 활동 기록
        ${crmCount>0?`<span style="color:var(--gold);margin-left:4px;">(${crmCount}건)</span>`:''}
      </button>
      <div class="card-crm">
        <div class="crm-title">121 미팅 기록</div>
        <div class="crm-row">
          <input class="crm-input meet-date" type="date">
          <input class="crm-input meet-memo" placeholder="메모" style="flex:2">
          <button class="crm-save" onclick="addCRM(this,'${card.docId}','meetings')">저장</button>
        </div>
        <div class="crm-title" style="margin-top:8px">리퍼럴 기록</div>
        <div class="crm-row">
          <input class="crm-input ref-date" type="date">
          <input class="crm-input ref-memo" placeholder="메모" style="flex:2">
          <button class="crm-save" onclick="addCRM(this,'${card.docId}','referrals')">저장</button>
        </div>
        <div class="crm-log">
          ${lastContactStr}${meetingLogs}${referralLogs}
          ${!lastContact&&crmCount===0?'<div class="crm-item"><span class="crm-item-text" style="opacity:.4">기록 없음</span></div>':''}
        </div>
      </div>
      <div class="card-saved">저장일: ${fmtDate(card.savedAt)}</div>
    </div>`;
  }).join('');

  // 오늘 날짜 기본값
  document.querySelectorAll('.meet-date,.ref-date').forEach(el => {
    if(!el.value) el.value = new Date().toISOString().split('T')[0];
  });
}

// ===== CRM 토글 =====
window.toggleCRM = function(btn) {
  const crm = btn.nextElementSibling;
  const arrow = btn.querySelector('.crm-arrow');
  crm.classList.toggle('open');
  arrow.textContent = crm.classList.contains('open') ? '▼' : '▶';
};

// ===== CRM 추가 =====
window.addCRM = async function(btn, docId, type) {
  const row = btn.closest('.crm-row');
  const isM = type === 'meetings';
  const dateEl = row.querySelector(isM ? '.meet-date' : '.ref-date');
  const memoEl = row.querySelector(isM ? '.meet-memo' : '.ref-memo');
  if(!dateEl.value) { showToast('날짜를 선택해주세요'); return; }
  const entry = { date: dateEl.value, memo: memoEl.value };
  try {
    const ref = db.collection('users').doc(currentUser.uid).collection('cards').doc(docId);
    const snap = await ref.get();
    const arr = snap.data()[type] || [];
    arr.unshift(entry);
    await ref.update({ [type]: arr, lastContact: new Date().toISOString() });
    memoEl.value = '';
    await loadCards();
    showToast('✅ 기록 저장됨');
  } catch(e) { showToast('❌ ' + e.message); }
};

// ===== CRM 삭제 =====
window.deleteCRM = async function(docId, type, idx) {
  try {
    const ref = db.collection('users').doc(currentUser.uid).collection('cards').doc(docId);
    const snap = await ref.get();
    const arr = snap.data()[type] || [];
    arr.splice(idx, 1);
    await ref.update({ [type]: arr });
    await loadCards();
    showToast('🗑️ 삭제됨');
  } catch(e) { showToast('❌ ' + e.message); }
};

// ===== 마지막 연락일 =====
window.updateLastContact = async function(docId) {
  try {
    await db.collection('users').doc(currentUser.uid).collection('cards').doc(docId)
      .update({ lastContact: new Date().toISOString() });
  } catch(e) {}
};

// ===== 챕터 필터 =====
window.filterChapter = function(chapter) {
  currentChapter = chapter;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.textContent.trim() === chapter));
  applyFilter();
};

function applyFilter() {
  let cards = [...allCards];
  if(currentChapter !== '전체') {
    cards = cards.filter(c => (c.chapter||'기타') === currentChapter);
  }
  renderCards(cards);
}

// ===== 검색 =====
window.onSearch = function(val) {
  clearTimeout(searchTimer);
  const q = val.trim();
  const aiEl = document.getElementById('aiResult');
  if(!q) { if(aiEl) aiEl.innerHTML=''; applyFilter(); return; }

  // 기본 검색 즉시
  const basic = allCards.filter(c => {
    const text = [c.name,c.nameEn,c.company,c.title,c.bni,c.fullText,c.chapter].filter(Boolean).join(' ').toLowerCase();
    return text.includes(q.toLowerCase());
  });
  renderCards(basic);

  // AI 검색 딜레이
  searchTimer = setTimeout(() => aiSearch(q), 800);
};

async function aiSearch(query) {
  if(allCards.length === 0) return;
  const aiEl = document.getElementById('aiResult');
  if(!aiEl) return;
  aiEl.innerHTML = `<div class="ai-loading"><div class="ai-dot"></div><div class="ai-dot"></div><div class="ai-dot"></div><span style="font-size:11px;color:var(--muted);margin-left:4px">AI 검색 중...</span></div>`;

  const summaries = allCards.map((c,i) =>
    `[${i}] ${c.name}(${c.chapter||'기타'}) ${c.company||''} ${c.title||''} ${c.bni||''} ${(c.fullText||'').slice(0,200)}`
  ).join('\n');

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 500,
        system: '당신은 BNI 명함첩 AI 검색 도우미입니다. JSON만 반환하세요: {"matched":[인덱스배열],"summary":"한줄요약"}',
        messages: [{ role: 'user', content: `검색어: "${query}"\n\n명함 목록:\n${summaries}\n\n검색어와 관련된 명함 인덱스를 찾아주세요. 업종, 전문분야, 리퍼럴 대상, 이름 등을 의미적으로 매칭하세요.` }]
      })
    });
    const data = await res.json();
    const text = data.content?.map(c=>c.text||'').join('').replace(/```json|```/g,'').trim();
    const result = JSON.parse(text);
    const matched = result.matched || [];
    if(matched.length > 0) {
      aiEl.innerHTML = `<div class="ai-result">✨ ${result.summary||''}</div>`;
      renderCards(matched.map(i=>allCards[i]).filter(Boolean));
    } else {
      aiEl.innerHTML = `<div class="ai-result">검색 결과가 없어요.</div>`;
      renderCards([]);
    }
  } catch(e) { aiEl.innerHTML = ''; }
}

// ===== 카드 삭제 =====
window.deleteCard = async function(docId, name) {
  if(!confirm(`"${name}" 명함을 삭제할까요?`)) return;
  try {
    await db.collection('users').doc(currentUser.uid).collection('cards').doc(docId).delete();
    await loadCards();
    showToast('🗑️ 삭제되었습니다.');
  } catch(e) { showToast('❌ ' + e.message); }
};

// ===== 카드 로드 =====
async function loadCards() {
  try {
    const snap = await db.collection('users').doc(currentUser.uid).collection('cards').orderBy('savedAt','desc').get();
    allCards = snap.docs.map(d => ({ ...d.data(), docId: d.id }));
    applyFilter();
  } catch(e) { showToast('❌ 불러오기 실패'); }
}

// ===== 공유 =====
window.shareApp = function() {
  if(navigator.share) navigator.share({ title:'BNI 명함첩', url: window.location.href });
  else { navigator.clipboard?.writeText(window.location.href); showToast('📋 링크 복사됨'); }
};

// ===== Auth 상태 감지 =====
auth.onAuthStateChanged(async user => {
  if(user) {
    currentUser = user;
    renderApp();
    await loadUserProfile(user.uid);
    await loadCards();
  } else {
    currentUser = null;
    allCards = [];
    renderLogin();
  }
});

// ===== Firestore 프로필 로드 =====
async function loadUserProfile(uid) {
  try {
    const doc = await db.collection('users').doc(uid).get();
    let name = currentUser.displayName || currentUser.email || '사용자';
    let title = '', company = '';
    if(doc.exists) {
      const d = doc.data();
      name    = d.name    || name;
      title   = d.title   || '';
      company = d.company || '';
    } else {
      await db.collection('users').doc(uid).set({
        name, title: '', company: '', uid,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
    }
    const el = document.getElementById('userName');
    if(el) {
      const display = [name, title, company].filter(Boolean).join(' · ');
      el.textContent = display;
    }
    generateMyQR(uid);
  } catch(e) {
    console.error('프로필 로드 실패', e);
  }
}

// ===== QR 자동 생성 =====
function generateMyQR(uid) {
  const canvas = document.getElementById('myQRCanvas');
  if(!canvas) return;
  if(typeof QRCode === 'undefined') {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js';
    s.onload = () => _drawQR(canvas, uid);
    document.head.appendChild(s);
  } else {
    _drawQR(canvas, uid);
  }
}
function _drawQR(canvas, uid) {
  const url = 'https://jinjjabg-hub.github.io/BNI-PIONEER-cards/\uC1A1\uC2B9\uD6C8/?ref=' + uid;
  QRCode.toCanvas(canvas, url, {
    width: 80, margin: 1,
    color: { dark: '#1a3a2a', light: '#f0faf4' }
  }, err => { if(err) console.error('QR \uC624\uB958', err); });
}

// ===== QR 팝업 토글 =====
function toggleQR() {
  const canvas = document.getElementById('myQRCanvas');
  if(!canvas) return;
  if(canvas.style.display === 'none' || canvas.style.display === '') {
    canvas.style.display = 'block';
    if(currentUser) generateMyQR(currentUser.uid);
    showToast('📱 내 명함 QR — 스캔하면 명함 열려요');
  } else {
    canvas.style.display = 'none';
  }
}

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>내 명함첩 · My Cardbook</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,400;1,400&family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore-compat.js"></script>
<style>
:root{
  --dark:#0a0a0a;--dark2:#141209;
  --gold:#c9a84c;--gold-light:#d4b862;
  --cream:#f0e8d8;--cream2:#e8dcc8;
  --red:#C8102E;
  --text-muted:rgba(240,232,216,0.45);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  background:var(--dark);color:var(--cream);
  font-family:'Noto Sans KR',sans-serif;
  max-width:430px;margin:0 auto;min-height:100vh;
}

/* TOP BAR */
.top-bar{
  position:sticky;top:0;z-index:100;
  background:rgba(10,10,10,0.97);backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(201,168,76,0.2);
  padding:14px 20px;
  display:flex;align-items:center;justify-content:space-between;
}
.top-bar-title{
  font-family:'Nanum Gothic',sans-serif;
  font-size:16px;font-weight:800;color:#fff;
  display:flex;align-items:center;gap:8px;
}
.top-bar-title span{color:var(--gold);}
.user-info{display:flex;align-items:center;gap:8px;}
.user-avatar{
  width:32px;height:32px;border-radius:50%;
  object-fit:cover;border:1px solid rgba(201,168,76,0.4);
}
.user-name{font-size:12px;color:var(--text-muted);}
.logout-btn{
  font-size:11px;color:var(--text-muted);
  background:none;border:1px solid rgba(255,255,255,0.1);
  border-radius:6px;padding:4px 10px;cursor:pointer;
  font-family:'Noto Sans KR',sans-serif;
  transition:all .2s;
}
.logout-btn:hover{color:#fff;border-color:rgba(255,255,255,0.3);}

/* LOGIN SCREEN */
.login-screen{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;min-height:80vh;padding:40px 28px;
  text-align:center;
}
.login-icon{font-size:60px;margin-bottom:24px;opacity:.8;}
.login-title{
  font-family:'Nanum Gothic',sans-serif;
  font-size:22px;font-weight:800;color:#fff;
  margin-bottom:12px;
}
.login-desc{
  font-size:13px;color:var(--text-muted);
  line-height:1.8;margin-bottom:32px;
}
.google-btn{
  display:flex;align-items:center;gap:12px;
  background:#fff;color:#1a1a1a;
  border:none;border-radius:12px;
  padding:14px 28px;font-size:14px;font-weight:600;
  cursor:pointer;transition:all .3s;
  font-family:'Noto Sans KR',sans-serif;
  box-shadow:0 4px 20px rgba(0,0,0,0.3);
}
.google-btn:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,0.4);}
.google-logo{width:20px;height:20px;}

/* LOADING */
.loading-screen{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;min-height:60vh;gap:16px;
}
.spinner{
  width:36px;height:36px;border:3px solid rgba(201,168,76,0.2);
  border-top-color:var(--gold);border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:13px;color:var(--text-muted);}

/* EMPTY */
.empty-state{
  display:flex;flex-direction:column;align-items:center;
  padding:60px 28px;text-align:center;
}
.empty-icon{font-size:56px;margin-bottom:20px;opacity:.6;}
.empty-title{font-size:16px;font-weight:700;color:#fff;margin-bottom:8px;}
.empty-desc{font-size:13px;color:var(--text-muted);line-height:1.75;}

/* CARD COUNT */
.card-count-bar{
  padding:16px 20px 8px;
  display:flex;align-items:center;justify-content:space-between;
}
.count-label{
  font-size:11px;color:var(--text-muted);letter-spacing:.1em;
}
.count-num{
  font-family:'Playfair Display',serif;
  font-size:14px;color:var(--gold);font-weight:400;
}

/* CARD GRID */
.card-grid{
  padding:8px 16px 100px;
  display:flex;flex-direction:column;gap:12px;
}
.biz-card{
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(201,168,76,0.18);
  border-radius:16px;overflow:hidden;
  transition:all .3s;position:relative;
}
.biz-card:hover{
  background:rgba(255,255,255,0.07);
  border-color:rgba(201,168,76,0.4);
  transform:translateY(-2px);
}
.card-header{
  padding:18px 18px 14px;
  display:flex;align-items:flex-start;gap:14px;
}
.card-avatar{
  width:50px;height:50px;border-radius:12px;
  object-fit:cover;flex-shrink:0;
  background:rgba(201,168,76,0.1);
  border:1px solid rgba(201,168,76,0.2);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;color:var(--gold);
  font-family:'Playfair Display',serif;
}
.card-avatar img{width:100%;height:100%;object-fit:cover;border-radius:11px;}
.card-meta{flex:1;min-width:0;}
.card-name{
  font-family:'Nanum Gothic',sans-serif;
  font-size:17px;font-weight:800;color:#fff;
  margin-bottom:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.card-name-en{
  font-family:'Playfair Display',serif;
  font-size:12px;color:var(--gold);font-style:italic;
  margin-bottom:5px;
}
.card-title{
  font-size:11px;color:var(--text-muted);
  line-height:1.5;
}
.card-company{
  font-size:12px;color:rgba(240,232,216,0.7);font-weight:500;
}

/* BNI badge */
.card-bni{
  display:inline-flex;align-items:center;gap:5px;
  background:rgba(200,16,46,0.1);
  border:1px solid rgba(200,16,46,0.25);
  border-radius:10px;padding:3px 9px;
  font-size:10px;color:rgba(240,100,100,0.9);
  margin-top:6px;letter-spacing:.05em;
}
.bni-dot{width:5px;height:5px;background:var(--red);border-radius:50%;flex-shrink:0;}

/* CARD ACTIONS */
.card-actions{
  padding:10px 14px 14px;
  display:flex;gap:8px;
}
.act-btn{
  flex:1;padding:10px 8px;
  border-radius:10px;border:none;
  font-size:11px;font-weight:600;
  cursor:pointer;transition:all .2s;
  font-family:'Noto Sans KR',sans-serif;
  display:flex;align-items:center;justify-content:center;gap:5px;
  text-decoration:none;
  min-height:38px;
}
.act-call{
  background:rgba(201,168,76,0.12);
  border:1px solid rgba(201,168,76,0.3);
  color:var(--gold);
}
.act-mail{
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.12);
  color:rgba(240,232,216,0.8);
}
.act-del{
  background:rgba(200,16,46,0.08);
  border:1px solid rgba(200,16,46,0.2);
  color:rgba(200,16,46,0.7);
  flex:0 0 38px;padding:10px;
}
.act-btn:hover{opacity:.8;transform:scale(0.98);}

/* SAVE DATE */
.card-saved{
  padding:0 18px 14px;
  font-size:10px;color:rgba(240,232,216,0.2);
  letter-spacing:.05em;
}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:430px;background:rgba(10,10,10,0.97);
  backdrop-filter:blur(16px);
  border-top:1px solid rgba(201,168,76,0.15);
  z-index:200;
  display:flex;
}
.nav-btn{
  flex:1;padding:14px 8px;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  font-size:10px;color:var(--text-muted);
  text-decoration:none;background:none;border:none;
  cursor:pointer;transition:all .3s;
  font-family:'Noto Sans KR',sans-serif;
  letter-spacing:.03em;
}
.nav-btn .icon{font-size:20px;line-height:1;}
.nav-btn:hover,.nav-btn.active{color:var(--gold);}

/* TOAST */
.toast{
  position:fixed;top:70px;left:50%;transform:translateX(-50%);
  background:rgba(30,25,15,0.97);
  border:1px solid rgba(201,168,76,0.3);
  border-radius:10px;padding:12px 20px;
  font-size:13px;color:var(--cream);
  z-index:500;
  opacity:0;transition:opacity .3s;pointer-events:none;
  white-space:nowrap;
}
.toast.show{opacity:1;}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="top-bar">
  <div class="top-bar-title">🗂️ <span>명함첩</span></div>
  <div class="user-info" id="userInfo" style="display:none">
    <span class="user-name" id="userName"></span>
    <button class="logout-btn" onclick="doLogout()">로그아웃</button>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- MAIN CONTENT -->
<div id="mainContent">
  <!-- 로딩 -->
  <div class="loading-screen" id="loadingScreen">
    <div class="spinner"></div>
    <div class="loading-text">불러오는 중...</div>
  </div>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <a href="./index.html" class="nav-btn">
    <span class="icon">📇</span>
    <span>명함 보기</span>
  </a>
  <button class="nav-btn active" onclick="">
    <span class="icon">🗂️</span>
    <span>명함첩</span>
  </button>
  <button class="nav-btn" onclick="shareCardbook()">
    <span class="icon">📤</span>
    <span>공유</span>
  </button>
</div>

<script>
// ===== 🔥 Firebase 설정 =====
// ⚠️ index.html과 동일한 값으로 교체하세요
const firebaseConfig = {
  apiKey: "AIzaSyAZoWSGSA81daZydNgzegct2aaeFbDajr0",
  authDomain: "mandu-e7c3c.firebaseapp.com",
  projectId: "mandu-e7c3c",
  storageBucket: "mandu-e7c3c.firebasestorage.app",
  messagingSenderId: "196338490174",
  appId: "1:196338490174:web:78dc77e684945aca362a6f"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;
let myCards = [];

// ===== 토스트 =====
function showToast(msg, duration=2500) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), duration);
}

// ===== 로그아웃 =====
async function doLogout() {
  await auth.signOut();
  currentUser = null;
  showLoginScreen();
}

// ===== 로그인 화면 =====
function showLoginScreen() {
  document.getElementById('userInfo').style.display = 'none';
  document.getElementById('mainContent').innerHTML = `
    <div class="login-screen">
      <div class="login-icon">🗂️</div>
      <div class="login-title">내 명함첩</div>
      <div class="login-desc">
        Google 로그인 후<br>저장한 명함을 어디서든 확인하세요.<br>
        <br>
        명함 페이지에서 "내 명함첩에 저장"을<br>누른 명함이 여기 모입니다.
      </div>
      <button class="google-btn" onclick="doGoogleLogin()">
        <svg class="google-logo" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Google로 로그인
      </button>
    </div>
  `;
}

// ===== Google 로그인 =====
async function doGoogleLogin() {
  const provider = new firebase.auth.GoogleAuthProvider();
  try {
    await auth.signInWithPopup(provider);
  } catch(err) {
    if(err.code !== 'auth/popup-closed-by-user') {
      showToast('❌ 로그인 실패: ' + err.message);
    }
  }
}

// ===== 명함 목록 불러오기 =====
async function loadCards(uid) {
  document.getElementById('mainContent').innerHTML = `
    <div class="loading-screen">
      <div class="spinner"></div>
      <div class="loading-text">명함첩 불러오는 중...</div>
    </div>
  `;
  try {
    const snap = await db.collection('users').doc(uid).collection('cards').orderBy('savedAt','desc').get();
    myCards = snap.docs.map(d => ({...d.data(), docId: d.id}));
    renderCards();
  } catch(err) {
    document.getElementById('mainContent').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">⚠️</div>
        <div class="empty-title">불러오기 실패</div>
        <div class="empty-desc">${err.message}</div>
      </div>
    `;
  }
}

// ===== 명함 렌더링 =====
function renderCards() {
  if(myCards.length === 0) {
    document.getElementById('mainContent').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🗂️</div>
        <div class="empty-title">저장된 명함이 없어요</div>
        <div class="empty-desc">
          명함 페이지에서<br>
          "내 명함첩에 저장" 버튼을 눌러<br>
          명함을 추가해 보세요.
        </div>
      </div>
    `;
    return;
  }

  const savedDate = (iso) => {
    if(!iso) return '';
    try {
      return new Date(iso).toLocaleDateString('ko-KR', {year:'numeric',month:'long',day:'numeric'});
    } catch{ return iso; }
  };

  const initials = (name) => {
    if(!name) return '?';
    return name.charAt(0);
  };

  let html = `
    <div class="card-count-bar">
      <span class="count-label">TOTAL CARDS</span>
      <span class="count-num">${myCards.length}</span>
    </div>
    <div class="card-grid">
  `;

  myCards.forEach((card, i) => {
    const hasAvatar = card.avatar && card.avatar.length > 0;
    const avatarHtml = hasAvatar
      ? `<div class="card-avatar"><img src="${card.avatar}" alt="${card.name}" onerror="this.parentElement.innerHTML='${initials(card.name)}'"></div>`
      : `<div class="card-avatar">${initials(card.name)}</div>`;

    const bniHtml = card.bni
      ? `<div class="card-bni"><div class="bni-dot"></div>${card.bni}</div>`
      : '';

    html += `
      <div class="biz-card" id="card-${i}">
        <div class="card-header">
          ${avatarHtml}
          <div class="card-meta">
            <div class="card-name">${card.name || '이름 없음'}</div>
            ${card.nameEn ? `<div class="card-name-en">${card.nameEn}</div>` : ''}
            ${card.company ? `<div class="card-company">${card.company}</div>` : ''}
            ${card.title ? `<div class="card-title">${card.title}</div>` : ''}
            ${bniHtml}
          </div>
        </div>
        <div class="card-actions">
          ${card.phone ? `<a href="tel:${card.phone}" class="act-btn act-call">📞 ${card.phone}</a>` : ''}
          ${card.email ? `<a href="mailto:${card.email}" class="act-btn act-mail">✉️ 메일</a>` : ''}
          <button class="act-btn act-del" onclick="deleteCard('${card.docId}', ${i})" title="삭제">🗑️</button>
        </div>
        ${card.url ? `<div style="padding:0 18px 8px"><a href="${card.url}" target="_blank" style="font-size:11px;color:rgba(201,168,76,0.6);text-decoration:none;">🔗 명함 보기</a></div>` : ''}
        <div class="card-saved">저장일: ${savedDate(card.savedAt)}</div>
      </div>
    `;
  });

  html += '</div>';
  document.getElementById('mainContent').innerHTML = html;
}

// ===== 명함 삭제 =====
async function deleteCard(docId, idx) {
  if(!confirm('이 명함을 명함첩에서 삭제할까요?')) return;
  try {
    await db.collection('users').doc(currentUser.uid).collection('cards').doc(docId).delete();
    myCards.splice(idx, 1);
    renderCards();
    showToast('🗑️ 명함이 삭제되었습니다.');
  } catch(err) {
    showToast('❌ 삭제 실패: ' + err.message);
  }
}

// ===== 공유 =====
function shareCardbook() {
  if(navigator.share) {
    navigator.share({title:'내 명함첩', url: window.location.href});
  } else {
    navigator.clipboard?.writeText(window.location.href);
    showToast('📋 링크가 복사되었습니다.');
  }
}

// ===== Auth 상태 감지 =====
auth.onAuthStateChanged(user => {
  if(user) {
    currentUser = user;
    document.getElementById('userInfo').style.display = 'flex';
    document.getElementById('userName').textContent = user.displayName || user.email || '';
    loadCards(user.uid);
  } else {
    showLoginScreen();
  }
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>디지털 명함</title>
<meta name="description" content="명함을 카드북에 저장하고 바로 연락하세요">
<meta property="og:title" content="디지털 명함">
<meta property="og:description" content="눌러서 명함 보기 · 카드북에 저장">
<meta name="theme-color" content="#1F3A5F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/card.css">
<style>
  html, body { margin: 0; min-height: 100%; background: #EDEBE6; }
  body { font-family: 'Noto Sans KR', system-ui, sans-serif; }
  #card { min-height: 100vh; }
  .state { max-width: 440px; margin: 0 auto; padding: 120px 24px; text-align: center; color: #3b3b3b; font-size: 15px; line-height: 1.7; }
  .state b { display: block; font-size: 18px; margin-bottom: 6px; color: #141414; }
  .state a { color: #1F3A5F; font-weight: 700; }
  .spin { width: 28px; height: 28px; border: 3px solid #ccc; border-top-color: #1F3A5F; border-radius: 50%; margin: 0 auto 14px; animation: s 0.8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  .banner { max-width: 440px; margin: 0 auto; background: #FFF4D6; color: #6A4B00; font-size: 13px; padding: 10px 16px; text-align: center; font-weight: 600; }
  .langbar { position: absolute; top: 12px; right: 12px; z-index: 5; display: flex; gap: 4px; background: rgba(0,0,0,.45); border-radius: 999px; padding: 4px; }
  .langbar button { border: 0; background: transparent; color: #fff; font: 700 12px/1 'Noto Sans KR', sans-serif; padding: 7px 10px; border-radius: 999px; cursor: pointer; }
  .langbar button.on { background: #fff; color: #141414; }
  .wrap { position: relative; max-width: 440px; margin: 0 auto; }
  .modal { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; padding: 24px; }
  .modal.on { display: flex; }
  .modal .box { background: #fff; border-radius: 20px; padding: 24px; text-align: center; width: 100%; max-width: 320px; }
  .modal #qr { display: flex; justify-content: center; margin: 8px 0 14px; }
  .modal button { border: 0; background: #141414; color: #fff; border-radius: 10px; padding: 12px 18px; font: 700 14px 'Noto Sans KR', sans-serif; width: 100%; cursor: pointer; }
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: #141414; color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 13px; z-index: 60; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.on { opacity: 1; }
</style>
</head>
<body>
<div id="banner"></div>
<div class="wrap">
  <div id="langbar"></div>
  <div id="card"><div class="state"><div class="spin"></div>명함을 불러오는 중…</div></div>
</div>
<div class="modal" id="qrModal"><div class="box"><div id="qrName" style="font-weight:800;margin-bottom:4px"></div><div id="qr"></div><button type="button" onclick="document.getElementById('qrModal').classList.remove('on')">닫기</button></div></div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="../assets/common.js"></script>
<script src="../assets/card.js"></script>
<script>
const params = new URLSearchParams(location.search);
const cardId = params.get('id');
const $ = id => document.getElementById(id);
let card = null, lang = 'ko';

function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 2200); }
function showState(title, body) { $('card').innerHTML = `<div class="state"><b>${title}</b>${body || ''}</div>`; }

async function load() {
  if (!cardId) return showState('명함 주소가 올바르지 않아요', '받은 링크를 다시 확인해주세요.');
  const { auth, db } = acInitFirebase();
  const ref = db.collection('autocards').doc(cardId);
  let snap;
  try {
    snap = await ref.get();   // 공개(published) 명함은 로그인 없이 읽힌다
  } catch (e) {
    // 공개 전이면 본인·관리자만 읽을 수 있음 → 로그인 상태가 복원되길 기다렸다가 한 번 더
    const user = await new Promise(r => { const u = auth.onAuthStateChanged(x => { u(); r(x); }); });
    if (!user) return showState('아직 공개되지 않은 명함이에요', '관리자 승인 후 열려요.<br>제작하신 분이라면 <a href="../">제작 앱</a>에서 로그인한 상태로 다시 열어주세요.');
    try { snap = await ref.get(); } catch (e2) { return showState('아직 공개되지 않은 명함이에요', '관리자 승인 후 열려요.'); }
  }
  if (!snap.exists) return showState('명함을 찾을 수 없어요', '삭제되었거나 주소가 잘못됐어요.');
  card = snap.data();
  if (card.status !== 'published') {
    $('banner').innerHTML = `<div class="banner">미리보기 — ${card.status === 'pending' ? '승인 대기 중이라 아직 다른 사람에게는 보이지 않아요' : '아직 발행 요청 전이에요'}</div>`;
  }
  const want = params.get('lang');
  lang = card.langs.includes(want) ? want : card.langs[0];
  draw();
}

function draw() {
  acRender($('card'), card, lang);
  const v = acView(card, lang);
  document.title = [v.name, v.title || v.company].filter(Boolean).join(' · ');
  document.documentElement.lang = lang;
  document.querySelector('meta[name=theme-color]').content = card.design.main;
  // "나도 만들기" → 어떤 명함을 보고 왔는지 기록 (확산 고리가 실제로 도는지 숫자로 확인하기 위해)
  const mk = document.querySelector('.ac-make'); if (mk) mk.href = '../?ref=' + encodeURIComponent(cardId);
  // 선택 언어가 2개 이상일 때만 상단 언어 전환
  $('langbar').innerHTML = card.langs.length > 1
    ? `<div class="langbar">${card.langs.map(l => `<button type="button" class="${l === lang ? 'on' : ''}" data-lang="${l}">${l.toUpperCase()}</button>`).join('')}</div>` : '';
}

document.addEventListener('click', e => {
  const lb = e.target.closest('[data-lang]');
  if (lb) { lang = lb.dataset.lang; draw(); history.replaceState(null, '', '?id=' + encodeURIComponent(cardId) + '&lang=' + lang); return; }
  const a = e.target.closest('[data-ac]');
  if (!a || !card) return;
  const act = a.dataset.ac;
  if (act === 'save') saveToCardbook();
  if (act === 'vcf') saveVcf();
  if (act === 'share') share();
  if (act === 'qr') showQr();
});

// 카드북 저장 — 기존 DiCA와 같은 방식: 카드북 주소에 명함 정보를 파라미터로 넘기면
// 카드북이 저장 팝업을 띄우고, 이름+전화번호가 같은 명함이 있으면 새로 만들지 않고 업데이트한다(중복 방지).
function saveToCardbook() {
  const base = card.langs.includes('ko') ? 'ko' : card.langs[0];
  const p = new URLSearchParams({
    name: acPick(card.name, base, card),
    nameEn: (card.name && card.name.en) || '',
    title: acPick(card.title, base, card),
    company: acPick(card.company, base, card),
    phone: card.phone || '',
    email: card.email || '',
    chapter: '기타',
    from: 'autocard',
    url: acCardUrl(cardId),
  });
  location.href = AC_CARDBOOK + '?' + p.toString();
}

function saveVcf() {
  const v = acView(card, lang);
  const blob = new Blob([acVcf(card, lang, acCardUrl(cardId))], { type: 'text/vcard;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = (v.name || 'contact') + '.vcf';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

async function share() {
  const v = acView(card, lang), url = acCardUrl(cardId);
  if (navigator.share) { try { await navigator.share({ title: v.name, text: v.slogan || v.name, url }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  try { await navigator.clipboard.writeText(url); } catch (e) { prompt('주소를 복사하세요', url); return; }
  toast(v.ui.copied);
}

function showQr() {
  const v = acView(card, lang);
  $('qr').innerHTML = '';
  new QRCode($('qr'), { text: acCardUrl(cardId), width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M });
  $('qrName').textContent = v.name;
  $('qrModal').classList.add('on');
}

load().catch(e => showState('명함을 불러오지 못했어요', '잠시 후 다시 열어주세요.<br><small>' + acEsc(e.message) + '</small>'));
</script>
</body>
</html>

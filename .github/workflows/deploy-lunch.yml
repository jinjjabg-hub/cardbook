# 점심 Worker(cardbook-lunch) 자동 배포 — 카드북 Worker(cardbook-ai)와 완전히 따로 돈다.
# main에 lunch/worker/ 가 바뀌면 테스트 → 배포. 기존 GitHub Secret CLOUDFLARE_API_TOKEN 을 그대로 쓴다.
name: Deploy lunch worker

on:
  push:
    branches: ["main"]
    paths: ["lunch/worker/**", ".github/workflows/deploy-lunch.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-lunch
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lunch/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: 설정 확인 (KV ID가 채워졌는지)
        run: |
          if grep -q '__LUNCH_KV_ID__' wrangler.toml; then echo "wrangler.toml에 KV ID(__LUNCH_KV_ID__)를 아직 안 넣었어요 — 배포 중단"; exit 1; fi
          node --check worker.js
      - name: 테스트
        run: node worker.test.mjs
      - name: Cloudflare Worker 배포
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

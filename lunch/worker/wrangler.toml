# 점심 Worker cardbook-lunch 배포 설정 (GitHub Actions가 main에 lunch/worker/ 가 바뀌면 자동 배포)
# 비밀값 ANTHROPIC_API_KEY · KAKAO_REST_KEY 는 여기 없음 — Cloudflare 대시보드(Worker → Settings → Variables and Secrets)에 저장
name = "cardbook-lunch"
main = "worker.js"
account_id = "184cfa4f47e805123284c4dbf2278a38"
compatibility_date = "2026-08-21"
keep_vars = true

# 식당 검색 6시간 캐시 + 하루 사용 한도. 대시보드에서 KV "cardbook-lunch-cache"를 만들고 그 ID를 아래에 넣는다
[[kv_namespaces]]
binding = "LUNCH_CACHE"
id = "__LUNCH_KV_ID__"

[observability]
enabled = true

# 카드북 Worker와 같은 이유로 미국 동부 고정(한국 망 → 홍콩 경유 시 Anthropic 403 방지)
[placement]
region = "aws:us-east-1"
